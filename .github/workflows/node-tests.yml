name: Node tests
on:
  push:
    branches: [feature/staircase-light-logic]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node --test tests/*.test.js
      - run: node --check src/staircaseLogic.js
      - run: node --check src/index.js
      - run: node --check src/webServer.js
