<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KNX MQTT – Einstellungen</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-body-tertiary"><main class="container py-4" style="max-width:740px"><div class="d-flex justify-content-between align-items-center mb-4"><h1 class="h3">Einstellungen</h1><a href="/routing.html" class="btn btn-outline-secondary">Routing Designer</a></div><section class="card"><div class="card-body"><h2 class="h5">KNX → MQTT</h2><form id="settings-form"><label class="form-label" for="base">Basistopic für automatisch angelegte MQTT-Devices</label><input id="base" class="form-control mb-2" required maxlength="180" value="knx" pattern="[^+#\\s]+"><p class="text-secondary small">Standard: <code>knx</code>. Für die Gruppenadresse 1/0/0 entsteht beispielsweise <code>knx/1/0/0</code>. Bereits angelegte MQTT-Devices werden nicht automatisch umbenannt.</p><button class="btn btn-primary" type="submit">Speichern</button><p id="status" role="status" class="mt-3"></p></form></div></section></main><script>
const input=document.getElementById('base'),status=document.getElementById('status');
async function request(method,body){const r=await fetch('/api/routing/settings',{method,headers:{'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});const d=await r.json();if(!r.ok)throw Error(d.error||'Speichern fehlgeschlagen');return d}
request('GET').then(d=>input.value=d.knxMqttBaseTopic||'knx').catch(e=>status.textContent=e.message);
document.getElementById('settings-form').addEventListener('submit',async e=>{e.preventDefault();try{const d=await request('PUT',{knxMqttBaseTopic:input.value.trim()});input.value=d.knxMqttBaseTopic;status.className='text-success mt-3';status.textContent='Einstellung gespeichert.'}catch(err){status.className='text-danger mt-3';status.textContent=err.message}});
</script></body></html>
